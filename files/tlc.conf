<VirtualHost *:80>
    DocumentRoot "/var/www/public"
    ServerName thompsonslovelycreations.com
    <Directory "/var/www/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    ErrorLog /var/log/httpd/tlc-error.log
    CustomLog /var/log/httpd/tlc-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName thompsonslovelycreations.com
    ServerAlias www.thompsonslovelycreations.com
    DocumentRoot "/var/www/public"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/thompsonslovelycreations.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/thompsonslovelycreations.com/privkey.pem

    <Directory "/var/www/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    ErrorLog /var/log/httpd/tlc-ssl-error.log
    CustomLog /var/log/httpd/tlc-ssl-access.log combined
</VirtualHost>
                  