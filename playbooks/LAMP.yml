---
- name: Deploy LAMP Server to webserver
  hosts: webservers
  become: true

  tasks:
   - name: Ensure correct packages are installed
     ansible.builtin.dnf:
      name:
       - httpd
       - mariadb-server
       - php-fpm
       - mod_ssl
       - python3.11
       - python3.11-pip
      state: present

   - name: Ensure packages are enabled and running
     ansible.builtin.systemd:
      state: started
      name: "{{ item }}"
      enabled: true
     loop:
      - firewalld.service
      - httpd.service
      - php-fpm.service
      - mariadb.service

   - name: Permanetly enable http services
     ansible.posix.firewalld:
      service: "{{ item }}"  
      state: enabled
      immediate: true
      permanent: true
     loop:
      - http
      - https

   - name: Permanetly enable http ports
     ansible.posix.firewalld:
      port: "{{ item }}" 
      state: enabled
      immediate: true
      permanent: true
     loop:
      - 80/tcp
      - 443/tcp

   - name: Create website directories
     ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: '0755'
     loop:
      - /var/www/public
      - /var/www/public/annies
      - /var/www/public/zys-bakes
      - /var/www/public/tech

   - name: Deploy TLC Apache configuration
     ansible.builtin.copy:
      src: /workspaces/rhel-engineer-home-lab/files/tlc.conf
      dest: /etc/httpd/conf.d/tlc.conf
      owner: root
      group: root
      mode: '0644'
     notify: Reload Apache

   - name: Deploy TLC web files
     ansible.builtin.copy:
      src: /workspaces/rhel-engineer-home-lab/files/website-archives/public.zip
      dest: /var/www/
      owner: root
      group: root
      mode: '0644'

   - name: Unzip TLC on Rhel-Webserver
     ansible.builtin.unarchive:
      src: /var/www/public.zip
      dest: /var/www/
      remote_src: true

   - name: Deploy Annies web files
     ansible.builtin.copy:
      src: /workspaces/rhel-engineer-home-lab/files/website-archives/annies_lab.zip
      dest: /var/www/public/annies/
      owner: root
      group: root
      mode: '0644'

   - name: Unzip Annies on Rhel-Webserver
     ansible.builtin.unarchive:
      src: /var/www/public/annies/annies_lab.zip
      dest: /var/www/public/annies/
      remote_src: true

  handlers:
   - name: Reload Apache
     ansible.builtin.service:
      name: httpd
      state: reloaded