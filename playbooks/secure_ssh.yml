---
- name: SSH Hardening on webserver
  hosts: webservers
  become: true

  tasks:
    - name: Deploy and validate SSH hardening
      block:
        - name: Deploy SSHD hardening template
          ansible.builtin.template:
            src: ../templates/sshd-hardening.conf.j2
            dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
            owner: root
            group: root
            mode: '0644'
          register: ssh_config

        - name: Validate complete SSH configuration
          ansible.builtin.command:
            cmd: /usr/sbin/sshd -t
          changed_when: false

        - name: Reload SSH after successful validation
          ansible.builtin.systemd_service:
            name: sshd.service
            state: reloaded
          when: ssh_config.changed

      rescue:
        - name: Remove invalid SSH configuration
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
            state: absent

        - name: Validate restored SSH configuration
          ansible.builtin.command:
            cmd: /usr/sbin/sshd -t
          changed_when: false

        - name: Restore running SSH configuration
          ansible.builtin.systemd_service:
           name: sshd.service
           state: reloaded

        - name: Stop play after failed SSH deployment
          ansible.builtin.fail:
            msg: "SEC-002 failed. SSH configuration rolled back."
